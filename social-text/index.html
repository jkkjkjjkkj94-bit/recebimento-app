<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voz — rede social de texto</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#0b0d12;--panel:#121621;--line:#232938;--text:#f5f7fb;--muted:#8f98aa;--accent:#7c5cff;--danger:#ff647c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:760px;margin:auto;min-height:100vh;border-inline:1px solid var(--line)}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#0b0d12e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:22px;letter-spacing:-.8px}.brand b{color:var(--accent)}button,input,textarea{font:inherit}.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.btn.secondary{background:#1b2030}.btn.ghost{background:transparent;color:var(--muted);padding:8px}.auth,.composer,.card,.empty{padding:20px;border-bottom:1px solid var(--line)}.auth h1{margin:0 0 8px;font-size:30px}.muted{color:var(--muted)}.row{display:flex;gap:10px}.stack{display:grid;gap:10px}.field{width:100%;background:#0f131d;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}.field:focus{border-color:var(--accent)}textarea.field{resize:vertical;min-height:96px}.composer footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.card{display:grid;grid-template-columns:44px 1fr;gap:12px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#22c1c3);font-weight:900}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.name{font-weight:800}.handle,.time{color:var(--muted);font-size:14px}.content{white-space:pre-wrap;line-height:1.55;margin:7px 0 12px;overflow-wrap:anywhere}.actions{display:flex;gap:8px}.action{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:9px}.action:hover{background:#171c29;color:white}.action.liked{color:#ff6d91}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.notice{padding:10px 14px;border-radius:12px;background:#171c29;color:var(--muted);font-size:14px}.error{color:#ff8a9c}.hidden{display:none!important}@media(max-width:600px){.shell{border:0}.row{flex-direction:column}.auth h1{font-size:26px}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand">V<b>o</b>z</div><div id="userActions" class="hidden"><button class="btn secondary" id="logoutBtn">Sair</button></div></header>

  <section id="authView" class="auth">
    <h1>Uma rede social feita para palavras.</h1>
    <p class="muted">Crie sua conta, publique textos e acompanhe a conversa em tempo real.</p>
    <div class="stack">
      <div class="row"><input id="email" class="field" type="email" placeholder="E-mail"><input id="password" class="field" type="password" minlength="6" placeholder="Senha"></div>
      <div id="registerFields" class="row"><input id="displayName" class="field" maxlength="60" placeholder="Nome"><input id="username" class="field" maxlength="24" placeholder="@usuario"></div>
      <div class="row"><button class="btn" id="registerBtn">Criar conta</button><button class="btn secondary" id="loginBtn">Entrar</button></div>
      <div id="authMsg" class="notice hidden"></div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <div class="composer">
      <div class="topline"><strong id="hello">Olá</strong><span class="muted">máx. 500 caracteres</span></div>
      <textarea id="postText" class="field" maxlength="500" placeholder="O que você quer dizer?"></textarea>
      <footer><span id="counter" class="muted">0/500</span><button id="publishBtn" class="btn">Publicar</button></footer>
    </div>
    <div id="feed"></div>
  </section>
</div>
<script>
const SUPABASE_URL='https://innziuzgtpfsiywqmies.supabase.co';
const SUPABASE_KEY='sb_publishable_fJB7zijdznI9ob9l9jSGlQ_6oU_J-d1';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, profile=null;
const $=s=>document.querySelector(s);
const esc=s=>(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function msg(text,error=false){const el=$('#authMsg');el.textContent=text;el.classList.remove('hidden');el.classList.toggle('error',error)}
async function ensureProfile(user, values={}){
  const {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(data) return data;
  if(!values.username) return null;
  const clean=values.username.toLowerCase().replace(/^@/,'').replace(/[^a-z0-9_.]/g,'').slice(0,24);
  const {data:created,error}=await db.from('profiles').insert({id:user.id,username:clean,display_name:values.displayName||clean}).select().single();
  if(error) throw error; return created;
}
async function register(){
  try{const email=$('#email').value.trim(),password=$('#password').value,displayName=$('#displayName').value.trim(),username=$('#username').value.trim();if(!email||password.length<6||!displayName||username.replace(/^@/,'').length<3) return msg('Preencha e-mail, senha (6+), nome e usuário (3+).',true);
    const {data,error}=await db.auth.signUp({email,password}); if(error) throw error;
    if(data.session){profile=await ensureProfile(data.user,{displayName,username});await boot(data.user)}else{localStorage.setItem('pending_profile',JSON.stringify({displayName,username}));msg('Conta criada. Confirme seu e-mail e depois entre.');}
  }catch(e){msg(e.message||'Não foi possível criar a conta.',true)}
}
async function login(){try{const {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error) throw error;const pending=JSON.parse(localStorage.getItem('pending_profile')||'null');profile=await ensureProfile(data.user,pending||{});if(profile)localStorage.removeItem('pending_profile');if(!profile)throw new Error('Perfil não encontrado. Crie uma conta primeiro.');await boot(data.user)}catch(e){msg(e.message||'Falha ao entrar.',true)}}
async function boot(user){me=user;profile=profile||await ensureProfile(user);if(!profile)return;$('#authView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userActions').classList.remove('hidden');$('#hello').textContent=`Olá, ${profile.display_name}`;await loadFeed();subscribe()}
async function loadFeed(){
  const {data:posts,error}=await db.from('posts').select('id,user_id,content,created_at,profiles(username,display_name),likes(user_id)').order('created_at',{ascending:false}).limit(100);if(error){$('#feed').innerHTML=`<div class="empty error">${esc(error.message)}</div>`;return}
  if(!posts?.length){$('#feed').innerHTML='<div class="empty muted">Ainda não há publicações. Escreva a primeira.</div>';return}
  $('#feed').innerHTML=posts.map(p=>{const liked=p.likes?.some(l=>l.user_id===me.id),mine=p.user_id===me.id,initial=(p.profiles?.display_name||'?')[0].toUpperCase();return `<article class="card"><div class="avatar">${esc(initial)}</div><div><div class="meta"><span class="name">${esc(p.profiles?.display_name||'Usuário')}</span><span class="handle">@${esc(p.profiles?.username||'usuario')}</span><span class="time">· ${new Date(p.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</span></div><div class="content">${esc(p.content)}</div><div class="actions"><button class="action ${liked?'liked':''}" onclick="toggleLike(${p.id},${liked})">♥ ${p.likes?.length||0}</button>${mine?`<button class="action" onclick="removePost(${p.id})">Excluir</button>`:''}</div></div></article>`}).join('');
}
async function publish(){const content=$('#postText').value.trim();if(!content)return;$('#publishBtn').disabled=true;const {error}=await db.from('posts').insert({user_id:me.id,content});$('#publishBtn').disabled=false;if(error)return alert(error.message);$('#postText').value='';$('#counter').textContent='0/500';await loadFeed()}
async function toggleLike(postId,liked){const q=liked?db.from('likes').delete().eq('post_id',postId).eq('user_id',me.id):db.from('likes').insert({post_id:postId,user_id:me.id});const {error}=await q;if(error)alert(error.message);else await loadFeed()}
async function removePost(id){if(!confirm('Excluir esta publicação?'))return;const {error}=await db.from('posts').delete().eq('id',id).eq('user_id',me.id);if(error)alert(error.message);else await loadFeed()}
let channel;function subscribe(){if(channel)return;channel=db.channel('voz-feed').on('postgres_changes',{event:'*',schema:'public',table:'posts'},loadFeed).on('postgres_changes',{event:'*',schema:'public',table:'likes'},loadFeed).subscribe()}
$('#registerBtn').onclick=register;$('#loginBtn').onclick=login;$('#publishBtn').onclick=publish;$('#logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};$('#postText').oninput=e=>$('#counter').textContent=`${e.target.value.length}/500`;
db.auth.getSession().then(async({data})=>{if(data.session){try{profile=await ensureProfile(data.session.user);if(profile)await boot(data.session.user)}catch(e){console.error(e)}}});
</script>
</body>
</html>
