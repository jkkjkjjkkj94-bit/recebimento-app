<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamentos - Visitante</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#0b1f3a;font:15px Arial,sans-serif}header{background:#081a33;color:white;padding:22px}header div,main{max-width:1000px;margin:auto}h1{margin:0;font-size:21px}header p{margin:5px 0 0;color:#dbe7f5}main{padding:22px 16px}.info,.item{background:white;border:1px solid #dce5f0;border-radius:14px;padding:16px}.info{margin-bottom:14px}.info b{color:#0b274a}.filters{display:flex;gap:8px;margin:12px 0}.filters input,.filters select{padding:10px;border:1px solid #cfdbea;border-radius:9px;font:inherit}.filters input{flex:1}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:80px 1fr auto;gap:12px}.date{font-weight:bold;color:#123b70}.supplier{font-weight:bold;font-size:16px}.meta,.desc{font-size:12px;color:#617087;margin-top:5px}.status{font-size:11px;font-weight:bold;background:#e8f0f8;padding:5px 8px;border-radius:20px;height:max-content}.empty{text-align:center;padding:30px;color:#617087;background:white;border-radius:14px}@media(max-width:600px){.filters{flex-direction:column}.item{grid-template-columns:65px 1fr}.status{grid-column:2;width:max-content}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><h1>AGENDAMENTO PROMOCIONAIS</h1><p>Visualização de agendamentos</p></div></header><main><div class="info"><b>Modo visitante</b><div>Você pode consultar os agendamentos. Alterações, exclusões e novos cadastros ficam bloqueados.</div><div class="filters"><input id="q" placeholder="Buscar fornecedor ou descrição"><select id="s"><option value="">Todos os status</option><option>Agendado</option><option>Concluído</option><option>Cancelado</option></select></div></div><div id="list" class="list"><div class="empty">Carregando...</div></div></main><script src="./supabase-config.js"></script><script>(()=>{const c=window.APP_CONFIG,d=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_KEY,{auth:{persistSession:false}});let a=[];const e=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function r(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('s').value,x=a.filter(v=>{const st=v.status||(v.concluido?'Concluído':'Agendado');return(!s||st===s)&&(!q||`${v.fornecedor||''} ${v.descricao||''}`.toLowerCase().includes(q))});document.getElementById('list').innerHTML=x.length?x.map(v=>{const st=v.status||(v.concluido?'Concluído':'Agendado'),dt=new Date(v.agendamento+'T12:00:00').toLocaleDateString('pt-BR');return `<div class="item"><div class="date">${dt}</div><div><div class="supplier">${e(v.fornecedor||'Sem fornecedor')}</div><div class="meta">${e(v.turno_recebido||'Turno não informado')}</div>${v.descricao?`<div class="desc">${e(v.descricao)}</div>`:''}</div><div class="status">${e(st)}</div></div>`}).join(''):'<div class="empty">Nenhum agendamento encontrado.</div>'}async function l(){const {data,error}=await d.from(c.TABLE).select('fornecedor,descricao,agendamento,turno_recebido,status,concluido').eq('user_id',c.SHARED_USER_ID).order('agendamento');if(error){document.getElementById('list').innerHTML='<div class="empty">Não foi possível carregar os agendamentos.</div>';return}a=data||[];r()}document.getElementById('q').oninput=r;document.getElementById('s').onchange=r;l()})();</script></body></html>
