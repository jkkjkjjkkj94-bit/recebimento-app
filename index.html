<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIMAX | Gestão de Notas Fiscais e Cargas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase banco na nuvem -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Dexie.js mantido para importar dados locais antigos -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Aplicação sem tela de login/cadastro -->
    <div id="appShell" class="flex flex-col min-h-screen">
    <!-- Cabeçalho -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-sm">A</div>
                <div>
                    <h1 class="font-semibold text-gray-900 leading-tight">ADIMAX</h1>
                    <p class="text-xs text-gray-500">Controle de Agendamento e Notas Fiscais</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 flex-wrap justify-end">
                <button type="button" onclick="importarDadosLocais()" class="bg-white border border-blue-200 hover:bg-blue-50 text-blue-700 font-medium px-3 py-1.5 rounded-lg text-xs transition shadow-sm">Importar dados antigos</button>
                <label for="importarCsv" class="cursor-pointer bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-3 py-1.5 rounded-lg text-xs transition shadow-sm flex items-center space-x-1">
                    <span>Importar CSV</span>
                </label>
                <input type="file" id="importarCsv" accept=".csv" class="hidden" onchange="importarCSV(event)">

                <button type="button" onclick="exportarCSV()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-3 py-1.5 rounded-lg text-xs transition shadow-sm flex items-center space-x-1">
                    <span>Exportar CSV</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-grow w-full grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Formulário de Cadastro / Novo Agendamento -->
        <section class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-fit">
            <h2 class="text-base font-semibold text-gray-900 mb-4 pb-2 border-b border-gray-100">Novo Agendamento</h2>
            <form id="formBrinde" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">NF (Nota Fiscal)</label>
                    <input type="text" id="codigo" required placeholder="Ex: 12345" 
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Fornecedor</label>
                    <input type="text" id="familia" required placeholder="Ex: Empresa Fornecedora" 
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Descrição</label>
                    <textarea id="descricao" rows="3" required placeholder="Detalhes sobre os itens da carga..." 
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Data do Agendamento</label>
                    <input type="date" id="agendamento" required
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition shadow-sm">
                    Salvar Agendamento
                </button>
            </form>
        </section>

        <!-- Lista e Painel de Agendamentos -->
        <section id="agendamento" class="md:col-span-2 bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                <h2 class="text-base font-semibold text-gray-900">Agenda de Cargas e Notas Fiscais</h2>
                <span id="totalBrindes" class="text-xs text-gray-500 font-medium">0 itens</span>
            </div>

            <!-- Campo de busca rápida e filtro por status -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                <input type="text" id="busca" placeholder="Buscar por NF, fornecedor ou descrição..." oninput="carregarBrindes()"
                    class="sm:col-span-2 px-3 py-2 text-sm border border-gray-200 bg-gray-50 rounded-lg focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition">
                
                <select id="filtroStatus" onchange="carregarBrindes()"
                    class="px-3 py-2 text-sm border border-gray-200 bg-gray-50 rounded-lg focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition text-gray-700">
                    <option value="todos">Todos os Status</option>
                    <option value="concluido">✅ Carga Concluída / Recebida</option>
                    <option value="vencidos">🔴 Vencidos</option>
                    <option value="hoje">⚪ Hoje</option>
                    <option value="futuros">🟡 Futuros (Agendados)</option>
                </select>
            </div>

            <!-- Tabela -->
            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-xs font-medium text-gray-400 border-b border-gray-100">
                            <th class="pb-3 font-medium">Data Agendada</th>
                            <th class="pb-3 font-medium">Fornecedor / NF</th>
                            <th class="pb-3 font-medium">Descrição</th>
                            <th class="pb-3 font-medium">Status da Carga</th>
                            <th class="pb-3 font-medium text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaBrindes" class="divide-y divide-gray-100 text-sm">
                        <!-- Dados dinâmicos -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Editar Registo Completo -->
    <div id="modalAgendamento" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
            <button type="button" onclick="fecharModalAgendamento()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            <h3 class="text-base font-semibold text-gray-900 mb-4">Editar Registo</h3>
            
            <form id="formAgendamentoModal" onsubmit="salvarEdicaoRegisto(event)" class="space-y-3">
                <input type="hidden" id="editBrindeId">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">NF (Nota Fiscal)</label>
                    <input type="text" id="editCodigo" required class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Fornecedor</label>
                    <input type="text" id="editFamilia" required class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Descrição</label>
                    <textarea id="editDescricao" rows="2" required class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Data do Agendamento</label>
                    <input type="date" id="editAgendamento" required class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="fecharModalAgendamento()" class="px-3 py-2 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-3 py-2 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-400">
        ADIMAX &copy; 2026 - Gestão de Agendamentos e Notas Fiscais
    </footer>
    </div>

    <!-- Lógica JavaScript (Supabase público + PostgreSQL; Dexie para migração local) -->
    <script>
        const SUPABASE_URL = "https://innziuzgtpfsiywqmies.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fJB7zijdznI9ob9l9jSGlQ_6oU_J-d1";
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
            document.body.insertAdjacentHTML("afterbegin", '<div class="m-4 rounded-lg bg-red-50 p-4 text-sm text-red-700">Não foi possível conectar ao Supabase. Verifique a internet e atualize a página com Ctrl + F5.</div>');
            throw new Error("Supabase JS CDN não carregou.");
        }
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        // O IndexedDB antigo é opcional; sua falha não deve bloquear login/cadastro na nuvem.
        let db = null;
        try {
            if (typeof window.Dexie === "function") {
                db = new window.Dexie("AdimaxNotasFiscaisDB");
                db.version(2).stores({
                    brindes: '++id, codigo, familia, descricao, agendamento, concluido'
                });
            }
        } catch (error) {
            console.warn("IndexedDB legado indisponível; autenticação continua habilitada.", error);
        }
        // Modo sem login: todos os visitantes usam o mesmo conjunto de registros.
        // A segurança de acesso aos dados passa a depender das políticas públicas do banco.
        const PUBLIC_USER_ID = "00000000-0000-4000-8000-000000000001";
        let usuarioAtual = { id: PUBLIC_USER_ID, email: "Acesso compartilhado" };
        const appShell = document.getElementById("appShell");

        async function iniciarAplicacao() {
            appShell.classList.remove("hidden");
            appShell.classList.add("flex");
            const lista = document.getElementById("listaBrindes");
            if (lista) lista.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-xs text-gray-500">Conectando ao banco de dados...</td></tr>';
            try {
                await carregarBrindes();
            } catch (error) {
                console.error("Erro ao carregar agendamentos:", error);
                if (lista) lista.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-xs text-red-600">Não foi possível carregar os dados da nuvem. Confira a conexão e as permissões do banco.</td></tr>';
            }
        }
        window.addEventListener("load", iniciarAplicacao);
        window.__adimaxAuthReady = true;

        async function consultarAgendamentos() {
            const { data, error } = await supabase.from("agendamentos_cargas").select("*").order("agendamento", { ascending: true });
            if (error) throw error;
            return (data || []).map(b => ({...b, familia: b.fornecedor, id: b.id}));
        }
        async function inserirAgendamento(brinde) {
            const { error } = await supabase.from("agendamentos_cargas").insert({
                user_id: usuarioAtual.id, codigo: brinde.codigo, fornecedor: brinde.familia,
                descricao: brinde.descricao, agendamento: brinde.agendamento, concluido: !!brinde.concluido
            });
            if (error) throw error;
        }
        async function atualizarAgendamento(id, campos) {
            const update = {};
            if ("codigo" in campos) update.codigo = campos.codigo;
            if ("familia" in campos) update.fornecedor = campos.familia;
            if ("descricao" in campos) update.descricao = campos.descricao;
            if ("agendamento" in campos) update.agendamento = campos.agendamento;
            if ("concluido" in campos) update.concluido = campos.concluido;
            update.updated_at = new Date().toISOString();
            const { error } = await supabase.from("agendamentos_cargas").update(update).eq("id", id);
            if (error) throw error;
        }

        function obterStatusAgendamento(brinde) {
            if (brinde.concluido) {
                return { 
                    status: 'concluido', 
                    texto: 'Concluída / Recebida', 
                    badgeClass: 'bg-blue-50 text-blue-700 border-blue-200 font-semibold' 
                };
            }

            if (!brinde.agendamento) {
                return { 
                    status: 'sem_agendamento', 
                    texto: 'Não agendado', 
                    badgeClass: 'bg-gray-100 text-gray-600 border-gray-200' 
                };
            }

            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            const dataAgendada = new Date(brinde.agendamento + 'T00:00:00');
            const diffDias = Math.round((dataAgendada - hoje) / (1000 * 60 * 60 * 24));

            if (diffDias < 0) {
                return { 
                    status: 'vencidos', 
                    texto: dataAgendada.toLocaleDateString('pt-BR') + ' (Vencido)', 
                    badgeClass: 'bg-red-50 text-red-700 border-red-200 font-semibold' 
                };
            } else if (diffDias === 0) {
                return { 
                    status: 'hoje', 
                    texto: dataAgendada.toLocaleDateString('pt-BR') + ' (Hoje)', 
                    badgeClass: 'bg-white text-gray-800 border-gray-300 shadow-sm font-bold' 
                };
            } else {
                return { 
                    status: 'futuros', 
                    texto: `${dataAgendada.toLocaleDateString('pt-BR')} (Faltam ${diffDias} dia${diffDias > 1 ? 's' : ''})`, 
                    badgeClass: 'bg-amber-50 text-amber-800 border-amber-200 font-semibold' 
                };
            }
        }

        // Cadastrar Agendamento
        document.getElementById("formBrinde").addEventListener("submit", async (e) => {
            e.preventDefault();

            const codigo = document.getElementById("codigo").value.trim(); // NF
            const familia = document.getElementById("familia").value.trim(); // Fornecedor
            const descricao = document.getElementById("descricao").value.trim(); // Descrição
            const agendamento = document.getElementById("agendamento").value;

            try {
                await inserirAgendamento({ codigo, familia, descricao, agendamento, concluido: false });
                document.getElementById("formBrinde").reset();
                carregarBrindes();
            } catch (error) {
                alert("Erro ao salvar o agendamento: " + error);
            }
        });

        // Carregar e filtrar agendamentos
        async function carregarBrindes() {
            const listaElement = document.getElementById("listaBrindes");
            listaElement.innerHTML = "";

            const buscaTexto = document.getElementById("busca").value.toLowerCase();
            const filtroStatus = document.getElementById("filtroStatus").value;

            try {
                if (!usuarioAtual) return;
                let brindes = await consultarAgendamentos();

                brindes = brindes.filter(b => {
                    const statusInfo = obterStatusAgendamento(b);

                    const bateBusca = (b.codigo && b.codigo.toLowerCase().includes(buscaTexto)) ||
                                      (b.familia && b.familia.toLowerCase().includes(buscaTexto)) ||
                                      (b.descricao && b.descricao.toLowerCase().includes(buscaTexto));

                    const bateStatus = (filtroStatus === 'todos') || (statusInfo.status === filtroStatus);

                    return bateBusca && bateStatus;
                });

                brindes.sort((a, b) => {
                    if (a.concluido !== b.concluido) return a.concluido ? 1 : -1;
                    if (!a.agendamento) return 1;
                    if (!b.agendamento) return -1;
                    return new Date(a.agendamento) - new Date(b.agendamento);
                });

                document.getElementById("totalBrindes").textContent = `${brindes.length} itens`;

                if (brindes.length === 0) {
                    listaElement.innerHTML = `
                        <tr>
                            <td colspan="5" class="py-6 text-center text-xs text-gray-400">Nenhum registo encontrado.</td>
                        </tr>
                    `;
                    return;
                }

                brindes.forEach(brinde => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-gray-50 transition";
                    
                    const statusInfo = obterStatusAgendamento(brinde);
                    const dataFormatada = brinde.agendamento ? new Date(brinde.agendamento + 'T00:00:00').toLocaleDateString('pt-BR') : 'Sem data';

                    tr.innerHTML = `
                        <td class="py-3 font-medium text-gray-700">${dataFormatada}</td>
                        <td class="py-3">
                            <div class="font-bold text-gray-900 text-sm">${brinde.familia || ''}</div>
                            <div class="text-xs text-gray-400 font-mono">NF: ${brinde.codigo || ''}</div>
                        </td>
                        <td class="py-3 text-gray-600 max-w-xs truncate" title="${brinde.descricao || ''}">
                            ${brinde.descricao || ''}
                        </td>
                        <td class="py-3">
                            <span class="inline-block px-2.5 py-1 text-xs rounded-full border ${statusInfo.badgeClass}">
                                ${statusInfo.texto}
                            </span>
                        </td>
                        <td class="py-3 text-right space-x-1">
                            <button type="button" onclick="alternarConcluido('${brinde.id}', ${!brinde.concluido})" class="text-xs px-2.5 py-1.5 rounded-md font-medium transition ${brinde.concluido ? 'bg-gray-100 text-gray-700 hover:bg-gray-200' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}" title="Marcar como Concluída/Recebida">
                                ${brinde.concluido ? '↩️ Reabrir' : '✔️ Concluir'}
                            </button>
                            <button type="button" onclick="abrirModalAgendamento('${brinde.id}')" class="text-gray-600 hover:text-blue-800 font-medium text-xs bg-gray-50 hover:bg-gray-100 p-1.5 rounded-md transition" title="Editar Registo">
                                ✏️
                            </button>
                            <button type="button" onclick="deletarBrinde('${brinde.id}')" class="text-red-600 hover:text-red-800 font-medium text-xs bg-red-50 hover:bg-red-100 p-1.5 rounded-md transition" title="Excluir">
                                🗑️
                            </button>
                        </td>
                    `;
                    listaElement.appendChild(tr);
                });
            } catch (error) {
                console.error("Erro ao carregar os dados:", error);
            }
        }

        // Alternar status de concluído/recebido
        window.alternarConcluido = async function(id, status) {
            try {
                await atualizarAgendamento(id, { concluido: status });
                carregarBrindes();
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
                alert("Erro ao alterar o status da carga.");
            }
        };

        // Funções globais de modal para edição completa
        window.abrirModalAgendamento = async function(id) {
            const brinde = (await consultarAgendamentos()).find(b => String(b.id) === String(id));
            if (brinde) {
                document.getElementById("editBrindeId").value = brinde.id;
                document.getElementById("editCodigo").value = brinde.codigo || "";
                document.getElementById("editFamilia").value = brinde.familia || "";
                document.getElementById("editDescricao").value = brinde.descricao || "";
                document.getElementById("editAgendamento").value = brinde.agendamento || "";
                document.getElementById("modalAgendamento").classList.remove("hidden");
            }
        };

        window.fecharModalAgendamento = function() {
            document.getElementById("modalAgendamento").classList.add("hidden");
        };

        window.salvarEdicaoRegisto = async function(e) {
            if (e) e.preventDefault();

            const id = document.getElementById("editBrindeId").value;
            const codigo = document.getElementById("editCodigo").value.trim();
            const familia = document.getElementById("editFamilia").value.trim();
            const descricao = document.getElementById("editDescricao").value.trim();
            const agendamento = document.getElementById("editAgendamento").value;

            if (!id) {
                alert("Erro ao identificar o registo.");
                return;
            }

            try {
                await atualizarAgendamento(id, { codigo, familia, descricao, agendamento });
                fecharModalAgendamento();
                carregarBrindes();
            } catch (error) {
                console.error("Erro ao atualizar o registo:", error);
                alert("Ocorreu um erro ao guardar as alterações.");
            }
        };

        window.deletarBrinde = async function(id) {
            if (confirm("Tem certeza que deseja remover este registo?")) {
                const { error } = await supabase.from("agendamentos_cargas").delete().eq("id", id);
                if (error) throw error;
                carregarBrindes();
            }
        };

        window.exportarCSV = async function() {
            const brindes = await consultarAgendamentos();
            if (brindes.length === 0) {
                alert("Nenhum dado para exportar.");
                return;
            }

            let csvContent = "\uFEFFAgendamento,NF,Fornecedor,Descricao,Status\n";

            brindes.forEach(b => {
                const agendamento = `"${b.agendamento || ''}"`;
                const codigo = `"${(b.codigo || '').replace(/"/g, '""')}"`;
                const fornecedor = `"${(b.familia || '').replace(/"/g, '""')}"`;
                const descricao = `"${(b.descricao || '').replace(/"/g, '""')}"`;
                const status = b.concluido ? "Concluido" : "Pendente";

                csvContent += `${agendamento},${codigo},${fornecedor},${descricao},${status}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "notas_fiscais_adimax.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.importarCSV = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const conteudo = e.target.result;
                const linhas = conteudo.split(/\r\n|\n/);
                if (linhas.length <= 1) {
                    alert("O arquivo CSV está vazio.");
                    return;
                }

                let inseridos = 0;

                for (let i = 1; i < linhas.length; i++) {
                    const linha = linhas[i].trim();
                    if (!linha) continue;

                    const colunas = linha.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || linha.split(",");
                    const colunasLimpas = colunas.map(col => col.replace(/^"|"$/g, '').trim());

                    if (colunasLimpas.length >= 4) {
                        await inserirAgendamento({
                            agendamento: colunasLimpas[0] || "",
                            codigo: colunasLimpas[1] || "",
                            familia: colunasLimpas[2] || "",
                            descricao: colunasLimpas[3] || "",
                            concluido: colunasLimpas[4] === "Concluido"
                        });
                        inseridos++;
                    }
                }

                alert(`${inseridos} registro(s) importado(s) para a nuvem com sucesso!`);
                carregarBrindes();
                document.getElementById("importarCsv").value = "";
            };

            reader.readAsText(file, 'UTF-8');
        };

        // Importação explícita de registros que ainda estejam no IndexedDB deste navegador.
        window.importarDadosLocais = async function() {
            if (!usuarioAtual) { alert("O sistema ainda está iniciando. Atualize a página e tente novamente."); return; }
            if (!db) { alert("A importação de dados antigos não carregou. Isso não afeta o login nem os dados na nuvem."); return; }
            try {
                const locais = await db.brindes.toArray();
                if (!locais.length) {
                    alert("Não encontramos registros antigos salvos neste navegador.");
                    return;
                }
                const ok = confirm(`Encontramos ${locais.length} registro(s) local(is). Importar para a base compartilhada na nuvem? Os registros locais serão mantidos e não serão apagados.`);
                if (!ok) return;
                let importados = 0;
                for (const b of locais) {
                    await inserirAgendamento({
                        codigo: b.codigo || "",
                        familia: b.familia || "",
                        descricao: b.descricao || "",
                        agendamento: b.agendamento || "",
                        concluido: !!b.concluido
                    });
                    importados++;
                }
                alert(`${importados} registro(s) copiado(s) para a nuvem. Os dados locais continuam guardados neste navegador.`);
                await carregarBrindes();
            } catch (error) {
                alert("Erro ao importar dados locais: " + (error.message || error));
            }
        };
    </script>
